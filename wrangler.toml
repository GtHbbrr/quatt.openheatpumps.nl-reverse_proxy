name = "quatt-openheatpumps-nl-reverse-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-29"

# Bind the Durable Object correctly for the Cloudflare Free Plan (Section 4)
[[durable_objects.bindings]]
name = "TUNNEL_REGISTRY"
class_name = "TunnelRegistry"

# Enforce SQLite-backed infrastructure migration mandatory for Free Plans
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TunnelRegistry"]


[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
